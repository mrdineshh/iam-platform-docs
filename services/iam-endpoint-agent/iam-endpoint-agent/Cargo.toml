[package]
name = "iam-endpoint-agent"
version.workspace = true
edition.workspace = true

[[bin]]
name = "iam-endpoint-agent"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../crates/agent-core" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
anyhow.workspace = true
base64.workspace = true
sha2.workspace = true

# Windows Service registration/lifecycle -- only usable on the Windows
# target (see src/platform/windows.rs). Not pulled in on other platforms so
# `cargo check`/`cargo test` still work in non-Windows dev/CI environments
# for the platform-agnostic logic this binary wires together.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
# Same version windows-service already uses (so no additional crate enters the build): ShellExecuteW to open
# the sign-in page in the default browser without going through cmd.exe -- see platform/windows.rs.
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_EventLog", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

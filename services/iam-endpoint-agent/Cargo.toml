[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "iam-endpoint-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

# Pinned, not left floating -- Engineering must still verify maintenance status,
# license, and vulnerability history before each dependency bump (spec Section 7.3).
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }

spring:
  application:
    name: iam-session-svc

  data:
    redis:
      host: ${REDIS_HOST:valkey}
      port: ${REDIS_PORT:6379}
      # BUILD_PLAN.md Section 4.6: no unbounded waits. Lettuce's default
      # command timeout is 60s, far too long for a hot-path session lookup.
      timeout: 2s
      connect-timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka-1:9092,kafka-2:9092,kafka-3:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 5
      # Real replication now (3 brokers, min-insync-replicas: 2) -- wait
      # for the write to actually reach the in-sync replica set before
      # considering an audit event durably published, not just leader-local.
      acks: all

  ssl:
    bundle:
      jks:
        mtls:
          keystore:
            location: file:/mtls/keystore.p12
            password: changeit
            type: PKCS12
          truststore:
            location: file:/mtls/truststore.p12
            password: changeit
            type: PKCS12

server:
  port: ${SERVER_PORT:8080}
  ssl:
    bundle: mtls
    # Mandatory -- iam-session-svc is called only by other backend
    # services (iam-auth-svc, iam-oidcprovider-svc, iam-enforcement-svc),
    # never by a browser or Node frontend directly. See docs/DECISIONS.md,
    # mTLS rollout entry, for the full caller-graph analysis behind which
    # services are "need" vs "want".
    client-auth: need

iam:
  audit:
    topic: audit-events
  openbao:
    address: ${BAO_ADDR:http://openbao:8200}
    token: ${BAO_TOKEN:}
  session:
    ttl: ${SESSION_TTL:8h}
    idempotency-window: 10m

management:
  server:
    # Separate, plain-HTTP-only port for actuator health/info -- kept
    # distinct from the now-mTLS-required API port so host-side health
    # checks and debugging don't need a client cert for something this
    # low-sensitivity.
    port: ${MANAGEMENT_PORT:9086}
    ssl:
      enabled: false
  tracing:
    sampling:
      # 100% for local MVP dev/demo -- the point of tracing here is to see
      # every request's full trace, not sample it (BUILD_PLAN.md Section 4.4).
      # Spring Boot's own default (10%) would drop most single test
      # requests, discovered while verifying the OQ-1 endpoint fix.
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          # Jaeger's OTLP receiver only accepts gRPC on 4317; Spring Boot 4's
          # tracing exporter defaults to HTTP (docs/OPEN_QUESTIONS.md OQ-1,
          # found in this service). 4318 is Jaeger's OTLP/HTTP port.
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}

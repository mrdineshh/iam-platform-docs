spring:
  application:
    name: iam-identity-svc

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${DB_USER:iam}
    password: ${DB_PASSWORD:localdev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka-1:9092,kafka-2:9092,kafka-3:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 5
      # Real replication now (3 brokers, min-insync-replicas: 2) -- wait
      # for the write to actually reach the in-sync replica set before
      # considering an audit event durably published, not just leader-local.
      acks: all

  ssl:
    bundle:
      jks:
        mtls:
          keystore:
            location: file:/mtls/keystore.p12
            password: changeit
            type: PKCS12
          truststore:
            location: file:/mtls/truststore.p12
            password: changeit
            type: PKCS12

server:
  port: ${SERVER_PORT:8080}
  ssl:
    bundle: mtls
    # Mandatory -- iam-identity-svc is called only by other backend
    # services (iam-auth-svc, iam-oidcprovider-svc, and the new
    # AdminAccessGuard clients in iam-tenant-svc/iam-policy-svc), never by
    # a browser or Node frontend directly. See docs/DECISIONS.md, mTLS
    # rollout entry.
    client-auth: need

iam:
  audit:
    topic: audit-events
  openbao:
    address: ${BAO_ADDR:http://openbao:8200}
    token: ${BAO_TOKEN:}
  dependencies:
    tenant-svc: ${TENANT_SVC_URL:http://iam-tenant-svc:8080}

resilience4j:
  circuitbreaker:
    instances:
      tenant-svc:
        failure-rate-threshold: 50
        sliding-window-size: 5
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound
  retry:
    instances:
      tenant-svc:
        max-attempts: 5
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

management:
  server:
    port: ${MANAGEMENT_PORT:9084}
    ssl:
      enabled: false
  tracing:
    sampling:
      # 100% for local MVP dev/demo -- the point of tracing here is to see
      # every request's full trace, not sample it (BUILD_PLAN.md Section 4.4).
      # Spring Boot's own default (10%) would drop most single test
      # requests, discovered while verifying the OQ-1 endpoint fix.
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          # Jaeger's OTLP receiver only accepts gRPC on 4317; Spring Boot 4's
          # tracing exporter defaults to HTTP (docs/OPEN_QUESTIONS.md OQ-1,
          # found in Service 6). 4318 is Jaeger's OTLP/HTTP port.
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}

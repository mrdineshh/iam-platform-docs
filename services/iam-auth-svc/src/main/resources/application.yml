spring:
  application:
    name: iam-auth-svc
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka-1:9092,kafka-2:9092,kafka-3:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 5
      # Real replication now (3 brokers, min-insync-replicas: 2) -- wait
      # for the write to actually reach the in-sync replica set before
      # considering an audit event durably published, not just leader-local.
      acks: all

server:
  port: ${SERVER_PORT:8080}
  # Deliberately still plain HTTP -- iam-auth-svc is called directly by
  # iam-login-portal's Node server and iam-admin-console's raw browser
  # (both POST /api/v1/login), neither of which can trust our self-signed
  # internal CA. This service's actual protection is password+TOTP/push
  # verification, not transport-level client certs. It still fetches a
  # cert at startup (see Dockerfile/mtls-entrypoint.sh) purely to act as an
  # mTLS *client* when calling the mandatory-mTLS services (identity/geo/
  # device/session-svc). See docs/DECISIONS.md, mTLS rollout entry, for
  # the full caller-graph analysis.

iam:
  audit:
    topic: audit-events
  openbao:
    address: ${BAO_ADDR:http://openbao:8200}
    token: ${BAO_TOKEN:}
  dependencies:
    identity-svc: ${IDENTITY_SVC_URL:http://iam-identity-svc:8080}
    geo-svc: ${GEO_SVC_URL:http://iam-geo-svc:8080}
    policy-svc: ${POLICY_SVC_URL:http://iam-policy-svc:8080}
    device-svc: ${DEVICE_SVC_URL:http://iam-device-svc:8080}
    session-svc: ${SESSION_SVC_URL:http://iam-session-svc:8080}
  # Added for Service 14 (iam-admin-console) -- see CorsConfig.kt.
  cors:
    allowed-origins: ${ADMIN_CONSOLE_ORIGIN:http://localhost:5173}

resilience4j:
  circuitbreaker:
    instances:
      identity-svc:
        failure-rate-threshold: 50
        sliding-window-size: 5
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
      geo-svc:
        failure-rate-threshold: 50
        sliding-window-size: 5
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
      policy-svc:
        failure-rate-threshold: 50
        sliding-window-size: 5
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
      device-svc:
        failure-rate-threshold: 50
        sliding-window-size: 5
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound
      session-svc:
        failure-rate-threshold: 50
        sliding-window-size: 5
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        # DELETE (logout) legitimately 404s on an already-terminated session
        # -- a business outcome, not a failure (same pattern as
        # iam-identity-svc's tenant-svc client).
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound
  retry:
    instances:
      identity-svc:
        max-attempts: 5
        exponential-backoff-multiplier: 2
        # Once the breaker opens, don't blindly retry "circuit is open" --
        # bug found and fixed in Service 4, applied everywhere from here on.
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      geo-svc:
        max-attempts: 5
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      policy-svc:
        max-attempts: 5
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      device-svc:
        # max-attempts: 1 (no retry) is deliberate, not the platform default --
        # totp/verify (attempt-counter/lockout side effect) and push/send
        # (sends a real notification, creates a challenge) are both mutating
        # and neither has an idempotency key yet, unlike session-svc's issue
        # endpoint. Retrying either on a lost response risks double-counting
        # a failed attempt or firing a duplicate push. Logged as a known gap
        # in docs/DECISIONS.md, Service 9 entry -- fail closed instead.
        max-attempts: 1
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - org.springframework.web.client.HttpClientErrorException$NotFound
      session-svc:
        max-attempts: 5
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - org.springframework.web.client.HttpClientErrorException$NotFound

management:
  tracing:
    sampling:
      # 100% for local MVP dev/demo -- the point of tracing here is to see
      # every request's full trace, not sample it (BUILD_PLAN.md Section 4.4).
      # Spring Boot's own default (10%) would drop most single test
      # requests, discovered while verifying the OQ-1 endpoint fix.
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}

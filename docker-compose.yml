services:
  postgres:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: iam
      # Only takes effect on first-ever initialization of an empty volume
      # (the official postgres image's own behavior) -- the real running
      # password was changed via ALTER USER 2026-10-26 (docs/DECISIONS.md,
      # exposing this port publicly for GUI DB access), this value is kept
      # in sync here only so a brand-new deployment matches what every
      # service below actually connects with.
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cloud SQL migration (2026-10-26, see docs/DECISIONS.md -- explicit,
  # logged override of this project's earlier "self-hosted Postgres, not
  # Cloud SQL" decision). Every service now points its DB_URL at
  # cloudsql-proxy:5432 instead of postgres:5432. Authenticates via the
  # VM's own service account (granted roles/cloudsql.client in
  # infra/opentofu) through the Cloud SQL Admin API -- no password, no
  # open port, no key file needed on this container.
  cloudsql-proxy:
    restart: unless-stopped
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.2
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUDSQL_INSTANCE_CONNECTION_NAME}"
    # No healthcheck: this image is distroless (no nc/curl/wget to probe
    # with, confirmed live -- every healthcheck attempt failed with
    # "executable file not found" even though the proxy itself was working
    # fine). Dependents use condition: service_started instead -- the
    # proxy is consistently ready for connections within ~1s of starting
    # (confirmed in its own logs), well before any JVM service finishes
    # booting anyway.

  valkey:
    restart: unless-stopped
    image: valkey/valkey:latest
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  openbao:
    restart: unless-stopped
    image: openbao/openbao:latest
    # Real server mode, not "-dev" -- raft storage persists the CA, PKI
    # roles, AppRole credentials, and KV secrets (password pepper, TOTP
    # DEKs, OIDC signing key) across restarts. Run
    # `python infra/openbao/bootstrap.py` once this container is up, before
    # bringing up the rest of the stack -- see infra/openbao/bootstrap.py's
    # own docstring and README.md.
    command: ["bao", "server", "-config=/openbao/config/config.hcl"]
    volumes:
      - ./infra/openbao/config.hcl:/openbao/config/config.hcl:ro
      - openbao-data:/openbao/file
    ports: ["8200:8200"]
    cap_add: ["IPC_LOCK"]
    healthcheck:
      # Deliberately treats "reachable" as healthy regardless of seal/init
      # state (exit 2 from `bao status` = sealed, not an outage) -- the
      # two-phase startup (bootstrap.py runs between bringing up openbao
      # alone and the rest of the stack) is what guarantees it's actually
      # unsealed by the time any dependent service starts.
      test: ["CMD-SHELL", "bao status -address=http://127.0.0.1:8200; test $$? -ne 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Real 3-broker KRaft cluster -- replaces the single-broker MVP deviation
  # (BUILD_PLAN.md D4). CLUSTER_ID must be identical across all three nodes
  # (a fixed value, not auto-generated per-container, which is exactly what
  # the apache/kafka image's entrypoint does by default if this isn't set
  # explicitly -- each node would otherwise format its own storage with a
  # different cluster ID and never form one cluster). All three run
  # combined broker+controller roles (simplest topology for a 3-node dev
  # cluster; a real production topology would likely separate them).
  kafka-1:
    restart: unless-stopped
    image: apache/kafka:latest
    environment:
      CLUSTER_ID: bz9B54gfSVaY8z9W4L46tg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Real replication now that there are 3 brokers to spread across.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-2:
    restart: unless-stopped
    image: apache/kafka:latest
    environment:
      CLUSTER_ID: bz9B54gfSVaY8z9W4L46tg
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-3:
    restart: unless-stopped
    image: apache/kafka:latest
    environment:
      CLUSTER_ID: bz9B54gfSVaY8z9W4L46tg
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  jaeger:
    restart: unless-stopped
    image: jaegertracing/all-in-one:latest
    ports: ["16686:16686", "4317:4317", "4318:4318"]   # UI on 16686, OTLP gRPC on 4317, OTLP HTTP on 4318

  # Centralized operational/application logging (distinct from audit_db's
  # security-event trail, see INTERNALS.md Part 1) -- the gap closed
  # 2026-10-26, see docs/DECISIONS.md. Standard three-pillar observability
  # shape: Jaeger already covers tracing, this covers logs, Prometheus is
  # the natural next addition for metrics (same Grafana instance, one more
  # datasource file in infra/grafana/provisioning/datasources/).
  loki:
    restart: unless-stopped
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports: ["3100:3100"]

  # Auto-discovers and ships every container's stdout/stderr to Loki --
  # needs the Docker socket (read-only) to discover containers, and the
  # host's container log directory (read-only) to actually tail them.
  promtail:
    restart: unless-stopped
    image: grafana/promtail:latest
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    restart: unless-stopped
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-GrafanaDemo123!}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["3002:3000"]
    depends_on:
      - loki

  iam-audit-svc:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: iam-audit-svc/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://cloudsql-proxy:5432/audit_db
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      BAO_ADDR: http://openbao:8200
      # No BAO_TOKEN -- this service never actually reads/writes any
      # OpenBao KV secret (Kafka-consumer only, no REST callers of its
      # own), so it doesn't need mTLS or an AppRole credential either.
    depends_on:
      cloudsql-proxy:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      openbao:
        condition: service_healthy
    ports: ["8081:8081"]

  iam-tenant-svc:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: iam-tenant-svc/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://cloudsql-proxy:5432/tenant_db
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      BAO_ADDR: http://openbao:8200
      # BAO_TOKEN is no longer set here -- mtls-entrypoint.sh derives a
      # short-lived one via AppRole login and exports it before starting
      # the JVM. This service's own inbound listener stays plain HTTP (a
      # real browser calls it directly), but it still needs a cert to call
      # the mandatory-mTLS services below. See docs/DECISIONS.md, mTLS
      # rollout entry.
      BAO_APPROLE_ROLE_ID: ${BAO_APPROLE_ROLE_ID}
      BAO_APPROLE_SECRET_ID: ${BAO_APPROLE_SECRET_ID}
      # Service 14 (iam-admin-console) -- admin-gated endpoints only.
      # https:// -- all three are mandatory-mTLS services now.
      SESSION_SVC_URL: https://iam-session-svc:8080
      IDENTITY_SVC_URL: https://iam-identity-svc:8080
      # Added for the admin-console "create user" / "My Security" 2FA pages.
      DEVICE_SVC_URL: https://iam-device-svc:8080
      # CORS: the admin console SPA's own real origin. Restored 2026-10-26
      # after being accidentally dropped in the monorepo migration (see
      # docs/DECISIONS.md) -- this file's own local copy had quietly
      # diverged from the VM's live-patched one before the migration.
      ADMIN_CONSOLE_ORIGIN: https://admin.34-71-129-0.sslip.io
      # Outbound SCIM provisioning refuses http and private/internal addresses unless this is true.
      # Keep it false anywhere real; it exists for local development and tests (see OutboundUrlGuard).
      SCIM_ALLOW_PRIVATE_TARGETS: ${SCIM_ALLOW_PRIVATE_TARGETS:-false}
    depends_on:
      cloudsql-proxy:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      openbao:
        condition: service_healthy
    ports: ["8082:8080"]

  iam-geo-svc:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: iam-geo-svc/Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      BAO_ADDR: http://openbao:8200
      BAO_APPROLE_ROLE_ID: ${BAO_APPROLE_ROLE_ID}
      BAO_APPROLE_SECRET_ID: ${BAO_APPROLE_SECRET_ID}
      MANAGEMENT_PORT: 9083
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      openbao:
        condition: service_healthy
    ports: ["8083:8080", "9083:9083"]

  iam-identity-svc:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: iam-identity-svc/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://cloudsql-proxy:5432/identity_db
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      BAO_ADDR: http://openbao:8200
      BAO_APPROLE_ROLE_ID: ${BAO_APPROLE_ROLE_ID}
      BAO_APPROLE_SECRET_ID: ${BAO_APPROLE_SECRET_ID}
      MANAGEMENT_PORT: 9084
      # tenant-svc's own inbound listener stays plain HTTP -- see that
      # service's application.yml comment.
      TENANT_SVC_URL: http://iam-tenant-svc:8080
      # Password rules and lockout settings (FR-3.1, FR-3.5) are read from
      # iam-policy-svc, which stays plain HTTP (browser-facing).
      POLICY_SVC_URL: http://iam-policy-svc:8080
    depends_on:
      cloudsql-proxy:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      openbao:
        condition: service_healthy
    ports: ["8084:8080", "9084:9084"]

  iam-policy-svc:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: iam-policy-svc/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://cloudsql-proxy:5432/policy_db
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      BAO_ADDR: http://openbao:8200
      BAO_APPROLE_ROLE_ID: ${BAO_APPROLE_ROLE_ID}
      BAO_APPROLE_SECRET_ID: ${BAO_APPROLE_SECRET_ID}
      # Service 14 (iam-admin-console) -- admin-gated endpoints only.
      # https:// -- both are mandatory-mTLS services now.
      SESSION_SVC_URL: https://iam-session-svc:8080
      IDENTITY_SVC_URL: https://iam-identity-svc:8080
      ADMIN_CONSOLE_ORIGIN: https://admin.34-71-129-0.sslip.io
    depends_on:
      cloudsql-proxy:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      openbao:
        condition: service_healthy
    ports: ["8085:8080"]

  iam-session-svc:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: iam-session-svc/Dockerfile
    environment:
      REDIS_HOST: valkey
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      BAO_ADDR: http://openbao:8200
      # BAO_TOKEN is no longer set here -- mtls-entrypoint.sh derives a
      # short-lived one via AppRole login and exports it before starting
      # the JVM. See docs/DECISIONS.md, mTLS rollout entry.
      BAO_APPROLE_ROLE_ID: ${BAO_APPROLE_ROLE_ID}
      BAO_APPROLE_SECRET_ID: ${BAO_APPROLE_SECRET_ID}
      MANAGEMENT_PORT: 9086
    depends_on:
      valkey:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      openbao:
        condition: service_healthy
    ports: ["8086:8080", "9086:9086"]

  iam-device-svc:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: iam-device-svc/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://cloudsql-proxy:5432/device_db
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: valkey
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      BAO_ADDR: http://openbao:8200
      BAO_APPROLE_ROLE_ID: ${BAO_APPROLE_ROLE_ID}
      BAO_APPROLE_SECRET_ID: ${BAO_APPROLE_SECRET_ID}
      MANAGEMENT_PORT: 9088
      IDENTITY_SVC_URL: https://iam-identity-svc:8080
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
    depends_on:
      cloudsql-proxy:
        condition: service_started
      valkey:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      openbao:
        condition: service_healthy
    ports: ["8088:8080", "9088:9088"]

  iam-auth-svc:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: iam-auth-svc/Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      BAO_ADDR: http://openbao:8200
      BAO_APPROLE_ROLE_ID: ${BAO_APPROLE_ROLE_ID}
      BAO_APPROLE_SECRET_ID: ${BAO_APPROLE_SECRET_ID}
      # https:// -- identity/geo/device/session-svc are all mandatory-mTLS
      # now; policy-svc stays plain HTTP (its own inbound listener isn't
      # mTLS -- see that service's application.yml comment).
      IDENTITY_SVC_URL: https://iam-identity-svc:8080
      GEO_SVC_URL: https://iam-geo-svc:8080
      POLICY_SVC_URL: http://iam-policy-svc:8080
      DEVICE_SVC_URL: https://iam-device-svc:8080
      SESSION_SVC_URL: https://iam-session-svc:8080
      ADMIN_CONSOLE_ORIGIN: https://admin.34-71-129-0.sslip.io
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      openbao:
        condition: service_healthy
    ports: ["8087:8080"]

  iam-enforcement-svc:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: iam-enforcement-svc/Dockerfile
    environment:
      REDIS_HOST: valkey
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      BAO_ADDR: http://openbao:8200
      BAO_APPROLE_ROLE_ID: ${BAO_APPROLE_ROLE_ID}
      BAO_APPROLE_SECRET_ID: ${BAO_APPROLE_SECRET_ID}
      # https:// -- session/geo-svc are mandatory-mTLS now; policy-svc
      # stays plain HTTP (its own inbound listener isn't mTLS).
      SESSION_SVC_URL: https://iam-session-svc:8080
      GEO_SVC_URL: https://iam-geo-svc:8080
      POLICY_SVC_URL: http://iam-policy-svc:8080
      IDENTITY_SVC_URL: https://iam-identity-svc:8080
      # PEP-as-gateway (docs/DECISIONS.md, gateway rollout entry) --
      # points at the stand-in "whoami" service below to prove
      # continuous enforcement against real forwarded traffic. Point
      # this at a real deployed app instead when there is one.
      PROXY_UPSTREAM_URL: http://whoami:80
      # Gateway cookie-login (docs/DECISIONS.md, gateway cookie-login
      # entry) -- lets a plain browser with no X-Session-Token go through
      # the normal login flow instead. Client id/secret are blank until
      # this gateway is registered as an OIDC client via iam-tenant-svc's
      # oidc-clients endpoint, same as any real third-party app would be
      # (see docs/DECISIONS.md for the exact registration call used to
      # verify this).
      GATEWAY_OIDC_CLIENT_ID: ${GATEWAY_OIDC_CLIENT_ID:-}
      GATEWAY_OIDC_CLIENT_SECRET: ${GATEWAY_OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_URL: http://iam-oidcprovider-svc:8080
      GATEWAY_BASE_URL: http://localhost:8089
      GATEWAY_COOKIE_SECURE: "false"
    depends_on:
      valkey:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      openbao:
        condition: service_healthy
    ports: ["8089:8080"]

  iam-oidcprovider-svc:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: iam-oidcprovider-svc/Dockerfile
    environment:
      REDIS_HOST: valkey
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      BAO_ADDR: http://openbao:8200
      BAO_APPROLE_ROLE_ID: ${BAO_APPROLE_ROLE_ID}
      BAO_APPROLE_SECRET_ID: ${BAO_APPROLE_SECRET_ID}
      # tenant-svc's own inbound listener stays plain HTTP; session/identity
      # are mandatory-mTLS now.
      TENANT_SVC_URL: http://iam-tenant-svc:8080
      SESSION_SVC_URL: https://iam-session-svc:8080
      # Service 13: auth-svc is no longer called directly by this service --
      # iam-login-portal calls it instead. identity-svc replaces it as a
      # dependency (resolves the email for a validated session's userId).
      IDENTITY_SVC_URL: https://iam-identity-svc:8080
      OIDC_ISSUER: http://localhost:8090
      # Must be reachable from the browser, not the internal Docker service
      # name -- same reasoning as OIDC_ISSUER above. No "{subdomain}" token
      # in this local-dev value, so GET /authorize appends "?tenant=..."
      # itself rather than constructing an unresolvable subdomain host.
      # Host port 3001, not 3000 -- see iam-login-portal's own port mapping.
      LOGIN_PORTAL_BASE_URL: ${ADMIN_CONSOLE_LOGIN_PORTAL_URL:-http://localhost:3001}
    depends_on:
      valkey:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      openbao:
        condition: service_healthy
    ports: ["8090:8080"]

  # Stand-in "protected app" for iam-enforcement-svc's reverse-proxy piece
  # (docs/DECISIONS.md, gateway rollout entry) -- a tiny Go binary that
  # just echoes back request details, exactly enough to prove routing +
  # enforcement work against real forwarded traffic. Point
  # PROXY_UPSTREAM_URL at a real deployed app instead when there is one;
  # this container has no other purpose.
  whoami:
    restart: unless-stopped
    image: traefik/whoami:latest
    ports: ["8091:80"]

  iam-login-portal:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: iam-login-portal/Dockerfile
    environment:
      AUTH_SVC_URL: http://iam-auth-svc:8080
      TENANT_SVC_URL: http://iam-tenant-svc:8080
      OIDCPROVIDER_SVC_URL: http://iam-oidcprovider-svc:8080
      # No wildcard DNS in local Docker Compose -- see
      # docs/specs/iam-login-portal-SPEC.md Section 3. This value never
      # matches a real local Host header, so tenant resolution always falls
      # back to the "?tenant=" override iam-oidcprovider-svc appends.
      LOGIN_PORTAL_ROOT_DOMAIN: platform.example.com
      # Single-tenant demo convenience; leave empty on a real multi-tenant deployment.
      LOGIN_PORTAL_DEFAULT_TENANT: ${LOGIN_PORTAL_DEFAULT_TENANT:-}
    # Host port 3001, not 3000 -- 3000 was already bound by an unrelated
    # local process on the dev machine this was verified on.
    ports: ["3001:3000"]

  iam-admin-console:
    restart: unless-stopped
    build:
      context: ./services
      dockerfile: iam-admin-console/Dockerfile
      # Pure static SPA (nginx) -- VITE_*_SVC_URL defaults in config.ts
      # only work when the browser loading this SPA is on the same machine
      # as the backend services. Override with build args pointing at
      # wherever this is actually being accessed from (see Dockerfile).
      args:
        VITE_AUTH_SVC_URL: ${ADMIN_CONSOLE_AUTH_SVC_URL:-http://localhost:8087}
        VITE_TENANT_SVC_URL: ${ADMIN_CONSOLE_TENANT_SVC_URL:-http://localhost:8082}
        VITE_POLICY_SVC_URL: ${ADMIN_CONSOLE_POLICY_SVC_URL:-http://localhost:8085}
        VITE_ROOT_DOMAIN: ${ADMIN_CONSOLE_ROOT_DOMAIN:-platform.example.com}
        VITE_OIDC_ISSUER_URL: ${ADMIN_CONSOLE_OIDC_ISSUER_URL:-http://localhost:8090}
        VITE_LOGIN_PORTAL_URL: ${ADMIN_CONSOLE_LOGIN_PORTAL_URL:-http://localhost:3001}
    ports: ["5173:80"]
    environment:
      # Origins the console's Content-Security-Policy lets the page talk to
      # (see iam-admin-console/nginx.conf.template). Same URLs as the build args.
      CSP_CONNECT_SRC: ${ADMIN_CONSOLE_AUTH_SVC_URL:-http://localhost:8087} ${ADMIN_CONSOLE_TENANT_SVC_URL:-http://localhost:8082} ${ADMIN_CONSOLE_POLICY_SVC_URL:-http://localhost:8085} ${ADMIN_CONSOLE_OIDC_ISSUER_URL:-http://localhost:8090}

volumes:
  pgdata:
  openbao-data:
  loki-data:
  grafana-data:

# Single-binary, filesystem-storage Loki -- the standard minimal config for
# a single-node deployment (this demo VM). A real multi-node production
# setup would swap the filesystem store for object storage (S3/GCS) and run
# Loki's components (distributor/ingester/querier) separately, but nothing
# about how services ship logs to it changes if that happens later.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093
